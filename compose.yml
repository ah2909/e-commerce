name: ecommerce-dev

x-app: &app
  image: ecommerce-backend:local
  build:
    context: .
  env_file: .env
  environment: &app-environment
    DATABASE_URL: postgres://ecommerce:ecommerce@postgres:5432/ecommerce?sslmode=disable
    REDIS_ADDRESS: redis:6379
    KAFKA_BROKERS: kafka:29092
    HTTP_ADDRESS: :8080
    METRICS_ADDRESS: :9090
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 45s

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./dev/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: "no"

  redis:
    image: redis:8.8.2
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 3s
    restart: "no"

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    restart: "no"

  kafka-topics:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - >-
        for topic in commerce.catalog.v1 commerce.inventory.v1 commerce.orders.v1 commerce.payments.v1 commerce.shipping.v1;
        do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1;
        done
    restart: "no"

  migrate:
    <<: *app
    entrypoint: [/migrate]
    command: [up]
    profiles: [app]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    profiles: [app]
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, /healthcheck, http://127.0.0.1:8080/health/ready]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  worker:
    <<: *app
    entrypoint: [/worker]
    profiles: [app]
    depends_on:
      api:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully

  tools: &tools
    build:
      context: .
      target: toolchain
    profiles: [tools]
    working_dir: /src
    env_file: .env
    environment:
      <<: *app-environment
      APP_ENV: test
      DATABASE_URL: postgres://ecommerce:ecommerce@localhost:5432/ecommerce?sslmode=disable
      TEST_DATABASE_URL: postgres://ecommerce:ecommerce@localhost:5432/ecommerce_test?sslmode=disable
      ALLOW_TEST_DATABASE_MUTATION: "true"
    volumes:
      - .:/src
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - go-tools:/src/.tools
    entrypoint: [make]
    command: [vulncheck]

  verify:
    <<: *tools
    # The test database guard requires loopback even inside Docker.
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    command: [verify]

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  go-modules:
  go-build:
  go-tools:
